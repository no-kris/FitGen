Port 8888
Listen 0.0.0.0
Timeout 600
MaxClients 100

# Connect-level logging: shows hosts being reached, plus filter denials at NOTICE.
# Drop to Notice once the allowlist has settled.
LogLevel Connect

# Only the dev container's pinned subnet may use the proxy
Allow 10.201.0.0/24

# Allowlist mode: deny everything not matching /etc/tinyproxy/filter
Filter "/etc/tinyproxy/filter"
FilterExtended On
FilterDefaultDeny Yes
FilterCaseSensitive Off

# CONNECT only on TLS ports
ConnectPort 443
